# CONTRACTS.yaml — Manju public contract registry (F0 Contract Governance)
#
# Roadmap §4.1/§4.2/§4.7. This file is the SINGLE declared registry of every
# public contract Manju ships. It is DECLARED + TEST-ENFORCED governance, never
# an execution input: no build/qc/provider code reads it (see
# src/manju/core/contracts.py — a pure loader consumed only by tests).
#
# Consistency is pinned by tests/test_fp_contracts.py:
#   (a) every `manju.*/vN` literal in src/manju/** is registered here;
#   (b) every registered schema id still appears in src (no ghost rows);
#   (c) statuses are one of the four levels; stable schemas declare read_older;
#   (d) the §4.7 ownership map below is complete for every listed concept.
#
# Status levels (§4.2):
#   stable        additive-only; a breaking change requires a new major.
#   experimental  no long-term compatibility promise.
#   internal      no third-party dependence; may change without a major.
#   deprecated    superseded but still readable.
#
# read_older / write_older (§4.4): read_older = current code loads an older
# major of this contract; write_older = current code can emit an older major
# (downgrade). Downgrade is never assumed — write_older is false everywhere
# today (no schema emits a prior major).

version: 1

# ---------------------------------------------------------------------------
# schemas — every `manju.*/vN` id emitted by src/manju. latest_version is the
# integer major in the id. owner is the module that DEFINES the schema constant.
# ---------------------------------------------------------------------------
