      ineligibility metadata. It is never project/build truth, a Provider
      request, qualification evidence, generated media or Picture Lock input.
  - id: manju.provider-handoff-manifest/v1
    kind: schema
    owner: manju.exporters.provider_handoff
    status: experimental
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      Deterministic bundle member inventory whose reference_plan_digest must
      equal handoff.json, refs.json and the prompt projection. SHA256SUMS covers
      every other emitted member; remote references are never downloaded.

# ---------------------------------------------------------------------------
# documents — public contracts that are NOT `manju.*/vN` schema ids: hand-edited
# truth files, evidence envelopes, and machine surfaces. Excluded from the
# ghost-row / literal checks (their ids are intentionally not schema ids).
# ---------------------------------------------------------------------------
documents:
  - id: project.yaml
    kind: document
    owner: manju.core.models:ProjectConfig
    status: stable
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      The project root config (name/width/height/fps/mode/budget…). Loaded by
      core.container.Project.load_config. R1 added OPTIONAL edit_rate {num,den}
      (fps stays the validated legacy int mirror; absent key ⇒ byte-identical
      serialization); the int→rational migration is IMPLEMENTED via manju
      migrate (see planned_migrations). S4 adds OPTIONAL cache_toolchain_keys
      (drop-None; tokens EXACTLY ffmpeg|fonts, validated — irrelevant facts
      rejected so they can never cause meaningless rebuilds); listed tokens
      fold those byte-affecting toolchain facts into every render cache key,
      so flipping the field is a documented cache-cold re-render. W4 adds
      OPTIONAL color {tag_outputs, input_transform srgb_to_bt709|p3_to_bt709}
      (drop-None; all-default block rejected — absent is the off switch):
      tag_outputs stamps finals/proxies bt709/tv (tags what IS, converts
      nothing) and re-keys via the hashed encoding list; input_transform is a
      DECLARED source-colour conversion at the normalize seam, folded into
      segment/boundary keys only when active.
  - id: bible
    kind: document
    owner: manju.core.container:Project
    status: stable
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      Character/scene/prop/style/voice identity (bible/*.yaml), loaded by
      Project.load_bible. The authoritative owner of character identity (§4.7).
  - id: shot.yaml
    kind: document
    owner: manju.core.models:ShotSpec
    status: stable
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      One shot per file (shots/<id>.yaml). Authoritative owner of shot intent
      AND selected take (§4.7). ShotContract is nested here; no second editable
      shot or acceptance file exists. Loaded by core.container.Project.load_shot.
  - id: timeline.json
    kind: document
    owner: manju.core.models:Timeline
    status: stable
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      Compiled + hand-editable timeline (timeline/timeline.json). Loaded by
      core.container.Project.load_timeline.
  - id: take-sidecar
    kind: document
    owner: manju.core.models:TakeSidecar
    status: stable
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      Per-take lineage sidecar (media/gen/<shot>/take_*.yaml): provider,
      spec_hash, spec_snapshot, virtual-trim window. Loaded by
      core.container.Project.takes.
  - id: events-envelope
    kind: document
    owner: manju.core.events:append_event
    status: internal
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      The events.jsonl collaboration-log envelope {ts, actor, action, detail}.
      One row for the ENVELOPE — the `action` strings are values, not schemas.
      Internal: append-only, old lines always readable.
  - id: reports-dir
    kind: document
    owner: manju.core.container:Project
    status: internal
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      The reports/ tree (runs/, delivery/, qc_*, frames/…) under
      Project.reports_dir. Derived + deletable projections; never a
      build/resume/cache input. Internal.
  - id: cli-json-surface
    kind: document
    owner: manju.cli
    status: stable
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      The public `--json` output surface across the CLI. Command names + required
      params are frozen by tests/fixtures/cli_surface.json (test_fp_cli_snapshot).
  - id: provider-manifest
    kind: document
    owner: manju.providers.manifest
    status: stable
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      Provider manifest (provider.yaml): capabilities/limits/refs/cost/auth.
      Additive `capabilities: list[str]`; old manifests load byte-identically.
  - id: manjupkg
    kind: document
    owner: manju.cli
    status: stable
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      The .manjupkg project archive (manju pack/unpack): deterministic member
      order, zip comment never trusted for restore paths, symlink members
      refused, decompression preflight (count + declared-total-vs-free-disk).
      Since FP wave 5 packs carry a final MANJU_FIXITY.json member (plain
      format manju-fixity.1 — not a manju.*/vN schema): unpack verifies and
      REMOVES a failed restore; packs without it restore byte-identically
      (advisory only); manju fixity verifies without extracting. Since the
      R/S continuation packs also self-describe with three fixity-covered
      transport members — MANJU_RESTORE.txt (manju-restore.1),
      MANJU_CONTRACTS.yaml (engine registry snapshot; honestly omitted when
      unavailable), MANJU_TOOLCHAIN.json — all dropped from a verified
      restore; manju fixity --info surfaces them read-only. W5.2 Windows
      hardening: pack prunes linked DIRECTORIES wholesale (junctions via the
      reparse lstat attribute on nt, symlinked dirs on any OS — rglob
      traverses both and one link smuggles an outside tree in) and WARNS
      (never blocks a backup) on members our own unpack would refuse
      (Windows-unportable names) and on casefold collisions; unpack REFUSES
      casefold-colliding members on every OS (one path after an NTFS
      extraction — silent data loss).
  - id: support-bundle
    kind: document
    owner: manju.core.supportbundle
    status: experimental
    latest_version: 1
    read_older: true
    write_older: false
    notes: >-
      Redacted diagnostic bundle (deterministic zip + MANIFEST.json with a plain
      `format: support-bundle-manifest.1` field — deliberately NOT a manju.*/vN
      schema). Default-deny collectors; self-scan tripwire refuses to write any
      bundle containing secret/path markers; never media bytes or source content.

# ---------------------------------------------------------------------------
# ownership — §4.7 object ownership map. One authoritative owner per concept;
# a concept is never authoritative in two editable objects at once. The
# consistency test asserts this map covers every listed concept.
# ---------------------------------------------------------------------------
ownership:
  shot_intent: ShotSpec + nested ShotContract (shots/<id>.yaml)
  character_identity: Bible (bible/*.yaml)
  selected_take: Shot YAML (status.selected)
  provider_request: GenerationRequest (providers)
  quality_evidence: QC evidence (reports/qc_agent.jsonl + qc/assurance)
  release_approval: verification event (append-only evidence)
  delivery_list: DeliveryManifest (manju.delivery-manifest/v1)
  runtime_state: append-only evidence + SQLite projection (.manju/)

# ---------------------------------------------------------------------------
# planned_migrations — declared future contract moves. RECORDED here, NOT
# implemented this loop (roadmap §16 #20: build for a real benefit, not because
# "another project has it"). No `manju migrate` machinery ships yet — there is
# no real pending migration to run (every schema is v1/v2 with no prior-major
# data in the wild).
# ---------------------------------------------------------------------------
planned_migrations:
  - id: project.fps-int-to-rational-edit-rate
    status: implemented
    implemented: true
    implemented_by: manju migrate (core.migrate) — R1 field/accessor, R2
      rational build spine, R4 export truth, R5 tooling (inspect/plan/
      apply/downgrade with CAS + --acknowledge-loss)
    affects: project.yaml
    from: >-
      project.yaml `fps: int` (core.models.ProjectConfig.fps is pinned to int
      today — see src/manju/core/models.py).
    to: >-
      A rational edit_rate {num, den} carried on the future
      manju.media-technical-profile/v1 (roadmap §5.1 / §13). 24000/1001-class
      rates cannot be expressed as an int.
    reason: >-
      Rational frame rate is the first declared future MAJOR. Declared now so
      the compatibility boundary is on record; the migration itself is deferred
      until the media-technical-profile schema lands (F1).
