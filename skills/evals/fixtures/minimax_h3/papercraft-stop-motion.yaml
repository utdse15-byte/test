schema: manju.skill-eval/v1
id: minimax-h3-papercraft-stop-motion
skill: prompt-craft
prompt: >-
  纸艺定格镜头有一张 start keyframe，无普通引用；把原有材质、构图和 endpoint
  编译成 H3 离线作者配置，不能补写新的动作。
expected:
