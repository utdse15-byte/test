[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manju"
version = "0.2.0"
description = "Manju One — a deterministic build system for video (text is truth, media is append-only)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# httpx: seven test modules import it directly (board/GUI transport tests) —
# without declaring it here the documented dev install collects 7 errors and
# only ever worked via another extra's transitive dependency (TRISURFACE F-23).
dev = [
    "pytest>=7.4",
    "hypothesis>=6.100",
    "pytest-xdist>=3.8",
    "httpx>=0.27",
    "click>=8.1",
    # Local-only browser acceptance tools.  Runtime remains stdlib/vanilla JS;
    # release developers may point Playwright at the system Edge/Chromium so
    # no browser binary is downloaded by an ordinary Manju install.
    "playwright>=1.57,<2",
]
# §2.5 P0 toolbelt — versions pinned (§14: 小众开源工具存续风险,版本全部锁定).
# Every tool sits behind an adapter wall: absence degrades, never breaks.
# FIX-F: three INDEPENDENT extras so each tool can be installed alone.
jianying = ["pyJianYingDraft==0.2.7"]  # 剪映草稿主路 (M1)
capcut = ["pycapcut==0.0.3"]           # 国际 CapCut 草稿 (M1)
edgetts = ["edge-tts==7.2.8"]          # 免费无 key 的云 TTS(竞品研究 round J)
# §10 WP6 exact color-stats (qc/colorstats.py): Pillow's integer channel
# histograms (numpy is absent by design). NOT a base dep — a hidden transitive
# today (the gating ci.yml pulls PIL only via the toolbelt libs above; a clean
# `pip install manju` has none), which the optimization audit sanctions declaring
# here. Absent → structured ColorStatsUnavailable, never a raw ModuleNotFoundError.
# Floor 9.3 = the first Pillow with cp311 wheels (this project is
# requires-python>=3.11); the APIs used (Image.open/convert/size/histogram) are
# ancient, so Python-3.11 wheel availability is the binding constraint, not the API.
colorstats = ["Pillow>=9.3"]

[project.scripts]
manju = "manju.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# Preset kits ship as package data so importlib.resources can read them from an
# installed wheel (src-layout: the glob is relative to the package dir).
[tool.setuptools.package-data]
"manju.presets" = ["data/*.yaml"]

# Incremental static checking (task 13): the lint gate is the OBVIOUS-ERROR
# subset only (syntax / undefined names / bug-prone patterns) — deliberately
# NOT a repo-wide style or strict-typing rewrite. This config makes a local
# `ruff check src` behave exactly like the CI `static` job (ci.yml). Newly
# introduced models (JobKindSpec, OperationOutcome/OutcomeCode/CancelRecord,
# ExecutionContext/CancelToken) are written fully type-annotated so a future
# opt-in strict typecheck can start from them without a large cleanup.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# UX audit F43: `-m "not ffmpeg"` is the fast dev loop (~3x quicker). Honest
# subset: only WHOLLY ffmpeg-gated modules carry the marker — mixed modules
# still run their pure halves, so the fast loop under-selects, never lies.
markers = [
    "ffmpeg: the whole module requires a real ffmpeg/ffprobe on PATH (deselect with -m 'not ffmpeg' for the fast dev loop)",
]
