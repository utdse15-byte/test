tasks:
- id: G0-001
  phase: G0
  title: 冻结零成本版基线与工具链证据
  priority: P0
  size: S
  mode: automated
  depends_on: []
  purpose: 在任何功能修改前记录当前分支、HEAD、工作区、Python、OS、FFmpeg 和基线测试，并确认没有云凭据进入本轮执行环境。
  rationale: 历史绿色只能说明历史 SHA；本轮必须从用户当前 checkout 的准确字节开始，且绝不能自动清理用户改动。
  inspect_first:
  - README.md
  - STATE.md
  - DECISIONS.md
  - CONTRACTS.yaml
  - CLAUDE.md
  - pyproject.toml
  - .github/workflows/ci.yml
  - .github/workflows/windows-ci.yml
  - tests/CONVENTIONS.md
  candidate_files_to_modify: []
  candidate_files_to_create:
  - REPORTS/THREE_PROJECTS_BASELINE_<date>.json
  - REPORTS/THREE_PROJECTS_BASELINE_<date>.md
  implementation_steps:
  - 运行 git status/rev-parse/log，记录实际分支和未提交文件；不自动清理用户改动。
  - 记录 Python、OS、ffmpeg/ffprobe；检查本轮 shell 中常见 provider key 变量是否存在，只记录“已设置/未设置”，绝不记录值。
  - 若发现任何云模型/provider key 已设置，停止并要求在本轮专用 shell 中清除后再继续。
  - 运行 compile/static 和一次基线 full suite；后续普通任务只跑 focused tests，减少 token 和计算浪费。
  - 把命令、退出码、耗时、失败摘要和 HEAD 写入 REPORTS；verbose log 留文件，不粘贴到 IDE 对话。
  tests:
  - 基线命令和退出码被记录。
  - 证据文件不被 build/runtime 读取。
  - 报告不含 secret 值、用户名或私有绝对路径。
  acceptance_criteria:
  - 工作区和 HEAD 明确。
  - 本轮 shell 无云 API Key。
  - 基线红时不开始功能开发。
  required_evidence:
  - 基线 JSON 与 Markdown
  - 完整命令日志摘要
  rollback:
  - 仅删除本任务新增报告；不改用户工作区。
  stop_conditions:
  - 发现用户未提交改动与目标文件重叠。
  - 检测到云 API Key 仍处于本轮环境。
  - 基础测试红且与本轮无关。
  notes:
  - No metered API calls are allowed in this edition.
- id: G0-002
  phase: G0
  title: 建立第三方边界、零成本政策与架构 ADR
  priority: P0
  size: M
  mode: automated
  depends_on:
  - G0-001
  purpose: 固定三个上游的 commit/LICENSE/关键能力快照，并把进程、数据、代码复用和失败边界写成治理文件。
  rationale: OpenChatCut 是 AGPL，Toonflow LICENSE 含附加商业/品牌条件，ViMax 虽为 MIT 也不应把其弱执行层直接移植。
  inspect_first:
  - DECISIONS.md append-only 规则
  - docs/SOURCE_LEDGER.yaml
  - OpenChatCut README/LICENSE/MCP session
  - ViMax README/LICENSE/paper/pipeline
  - Toonflow README/LICENSE/VM/provider/task record
  candidate_files_to_modify:
  - docs/SOURCE_LEDGER.yaml
  - DECISIONS.md
  candidate_files_to_create:
  - docs/architecture/ADR-THREE-PROJECT-INTEGRATION-ZERO-COST.md
  - docs/architecture/THIRD_PARTY_BOUNDARIES.md
  - docs/runbooks/ZERO_COST_MODE.md
  implementation_steps:
  - 记录三个上游仓库当前完整 commit、许可证文件 SHA256 和本轮实际阅读的关键文件。
  - 写清四层架构和 clean-room 规则；OpenChatCut/ViMax/Toonflow 都不得成为 Manju core runtime 依赖。
  - 写入 strict zero-cost 决策：禁止 metered/free-tier cloud inference、禁止 provider key、禁止真实 provider submit、禁止自动大模型权重下载。
  - 允许 localhost fake provider、FFmpeg/Python 合成媒体、已有本地素材和 OpenChatCut 非 AI 本地编辑。
  - 所有第三方能力 optional；缺失不得阻断 Manju check/build/qc/export。
  - DECISIONS.md 只追加新条目，不修改历史。
  tests:
  - YAML 可安全加载。
  - 核心 runtime dependencies 不含三个上游。
  - 静态边界测试覆盖 src/manju、skills 和 package metadata。
  acceptance_criteria:
  - adopt/adapt/reject 与 strict zero-cost 条款明确。
  - 后续 IDE 不需要猜测是否可以调用 free tier：答案始终是不可以。
  - 任何付费研究必须另建未来计划。
  required_evidence:
  - 上游 snapshot YAML
  - ADR 与边界测试输出
  rollback:
  - 回退本任务独立提交；运行时零影响。
  stop_conditions:
  - 无法确定当前 LICENSE 文本。
  - 实现目标要求复制受限制源码或素材。
  notes:
  - No metered API calls are allowed in this edition.
- id: P0-001
  phase: P0
  title: 建立零成本运行策略、外部模型出口硬禁用与本地 Proof 配置
  priority: P0
  size: M
  mode: automated
  depends_on:
  - G0-002
  purpose: 审计 ProviderManifest、preflight、submission identity、attempt ledger 和 transport owner，并为本轮建立 localhost-only 的执行策略。
  rationale: 用户明确零预算。最重要的不是挑一个“免费额度”供应商，而是从代码和流程上保证不会误发任何计费请求。
  inspect_first:
  - src/manju/providers/manifest.py
  - src/manju/providers/catalog.py
  - src/manju/providers/preflight.py
  - src/manju/providers/submission.py
  - src/manju/providers/generic_cloud.py
  - src/manju/providers/base.py
  - src/manju/build/attempts.py
  - src/manju/build/spend.py
  - src/manju/build/readiness.py
  - 相关 CLI docs/tests
  candidate_files_to_modify:
  - 仅在审计证明表达缺口时修改 provider owner；默认不改公共 schema。
  candidate_files_to_create:
  - docs/runbooks/ZERO_COST_LOCAL_PROOF_SHOT.md
  - scripts/dogfood/local_proof_preflight.py
  - tests/test_zero_cost_provider_policy.py
  implementation_steps:
  - 审计是否已有 offline/network/provider policy owner；优先复用。
  - 定义本轮执行环境：仅 loopback HTTP/stdio/local files；非 loopback provider endpoint 在 transport 前失败。
  - 不要请求或配置任何 provider key；若 manifest 含 secret_ref，只允许 schema/dry-run 展示“未配置”，不得解析值。
  - 选择 localhost fake async provider profile；固定 3–6 秒、720p、候选数 1、cost=0。
  - 运行 catalog/check/prompt check/build dry-run，保存 secret-free request、execution-profile digest、request digest 和 zero-cost
    policy 状态。
  - 若核心缺少可验证的 network policy，按唯一 owner 做最小 additive 实现；旧项目默认行为不能被意外改变。
  tests:
  - strict zero-cost 下非 loopback transport_count=0。
  - localhost fake provider 可通过 preflight。
  - 无需任何凭据。
  - 同输入 digest 稳定。
  acceptance_criteria:
  - 所有后续任务有可机器验证的零成本/localhost-only 边界。
  - 没有真实 provider profile 或 API Key。
  - 本任务零网络模型调用、零费用。
  required_evidence:
  - zero-cost policy snapshot
  - localhost provider profile
  - preflight/dry-run JSON
  - egress-block test
  rollback:
  - 删除专用 profile/docs；若新增 policy code，独立回退且旧行为测试仍绿。
  stop_conditions:
  - 实现只能靠“提醒 IDE 小心”而不能在 transport 前验证。
  - 任何步骤要求 cloud key、free tier 或真实 endpoint。
  notes:
  - No metered API calls are allowed in this edition.
- id: P0-002
  phase: P0
  title: 用 localhost 假 Provider 验证请求、时长与零成本身份（条件任务）
  priority: P0
  size: L
  mode: conditional
  depends_on:
  - P0-001
  purpose: 在纯本地环境验证整数秒、最小时长、量化步长、分辨率和模拟成本事实是否在 request/preflight/submission identity 中一致。
  rationale: 这项工作可提前发现真实 provider 适配缺口，但不需要连接真实供应商。若现有抽象已满足，则标记 NOT_NEEDED。
  inspect_first:
  - src/manju/providers/manifest.py CostConfig/LimitsConfig
  - src/manju/providers/preflight.py
  - src/manju/providers/submission.py
  - src/manju/providers/generic_cloud.py render values
  - src/manju/build/spend.py
  - provider execution-profile contracts
  candidate_files_to_modify:
  - src/manju/providers/manifest.py
  - src/manju/providers/preflight.py
  - src/manju/providers/submission.py
  - src/manju/providers/generic_cloud.py
  - src/manju/build/spend.py
  - CONTRACTS.yaml（仅有新 schema literal 时）
  candidate_files_to_create:
  - tests/test_provider_billable_request.py
  implementation_steps:
  - 先用 fake manifest 证明 duration/resolution/candidate semantics；不需要则零代码结束。
  - 若需要，定义纯函数 effective_request_facts，输出 requested/submitted/billable duration、resolution、candidate count 和 simulated cost
    components。
  - fake provider 的实际费用固定为 0；可另用不执行的 synthetic price fixture 测量计费公式，但不得连接外部 endpoint。
  - request body、preflight、identity、attempt evidence 共用同一冻结结果。
  - 旧 manifest 无新字段时 byte-compatible。
  tests:
  - 4.2 秒量化到 5 秒的纯函数测试。
  - fake provider actual cost=0。
  - 任何非 loopback URL 在 transport 前失败。
  - 旧 manifest 兼容。
  acceptance_criteria:
  - 请求与身份事实一致。
  - 无真实价格、账号或供应商依赖。
  - NOT_NEEDED 时代码零修改。
  required_evidence:
  - local request truth table
  - compatibility snapshot
  - zero-network test
  rollback:
  - 回退 additive 字段；兼容测试证明旧行为恢复。
  stop_conditions:
  - 需要真实供应商文档或请求才能完成。
  - 需要破坏 stable provider API。
  notes:
  - No metered API calls are allowed in this edition.
- id: P0-003
  phase: P0
  title: 建立零成本异步假 Provider 故障注入测试台
  priority: P0
  size: L
  mode: automated
  depends_on:
  - P0-001
  - P0-002
  purpose: 用 localhost fake provider 复现 submit、ambiguous response、poll、重启恢复、下载和重复执行危险时序。
  rationale: 在零预算下仍可完整验证任务账本、恢复和 append-only 媒体语义。
  inspect_first:
  - 现有 provider/submission/attempt fixtures
  - src/manju/providers/base.py
  - src/manju/providers/generic_cloud.py
  - src/manju/providers/submission.py
  - src/manju/build/attempts.py
  - src/manju/core/events.py
  candidate_files_to_modify:
  - 仅在测试暴露真实 bug 时改对应 owner；禁止测试后门。
  candidate_files_to_create:
  - tests/fixtures/fake_async_video_provider.py
  - tests/test_paid_provider_fault_matrix.py
  - scripts/dogfood/simulate_paid_provider.py
  implementation_steps:
  - 实现 localhost HTTP fake：submit 返回 job_id；poll 可 queued/running/succeeded/failed；download 返回本地生成视频或错误页。
  - 用 FFmpeg 在测试启动时生成确定性短 MP4，不下载模型或素材。
  - 加入提交后响应丢失、persist 后退出、poll 429/503、URL 过期、下载中断、JSON/HTML 伪装 MP4。
  - 同 submission identity 重跑不得再次 submit；ambiguous 状态只能 attach/abandon/reconcile。
  - 测试并发 CAS、媒体验证、hash 和 append-only take。
  - 测试网络策略：只有 loopback fake endpoint 被允许。
  tests:
  - 每个故障场景断言 submit_count/poll_count/download_count。
  - 新进程恢复原 job。
  - 错误媒体不注册。
  - CI 不访问公网。
  acceptance_criteria:
  - 危险时序有自动化回归。
  - 零外部请求。
  - 无需凭据或账单。
  required_evidence:
  - fault matrix
  - 调用计数和测试输出
  rollback:
  - 删除测试台；生产 bug 修复需单独评估。
  stop_conditions:
  - 测试必须联网。
  - 模拟要求绕过 submission identity。
  notes:
  - No metered API calls are allowed in this edition.
- id: P0-004
  phase: P0
  title: 执行一次零成本本地 Proof Shot
  priority: P0
  size: M
  mode: manual_review
  depends_on:
  - P0-003
  purpose: 用 localhost 假 Provider 和 FFmpeg 合成媒体验证合同、提交恢复、下载、hash-bound QC 与人工选择完整闭环。
  rationale: 它不能替代真实模型质量验证，但能在零费用下证明 Manju 的执行和证据架构。
  inspect_first:
  - docs/runbooks/ZERO_COST_LOCAL_PROOF_SHOT.md
  - manju production status --json
  - providers check/catalog
  - prompt --check
  - build --dry-run
  - tasks
  - qc brief/verdict/select
  candidate_files_to_modify: []
  candidate_files_to_create:
  - REPORTS/ZERO_COST_LOCAL_PROOF_SHOT_<date>.json
  - REPORTS/ZERO_COST_LOCAL_PROOF_SHOT_<date>.md
  implementation_steps:
  - 确认 strict zero-cost policy active，provider endpoint 为 loopback，环境中无云 key。
  - 生成一条带可验证时长/分辨率/帧标记的确定性本地 MP4；不调用生成模型。
  - 通过 localhost fake async provider 提交；记录本地 submission id 和 fake remote job id。
  - 在 queued/running 时故意结束进程，再启动并确认只 poll 原 job、submit_count=1。
  - 成功后下载 localhost 结果，验证 ffprobe facts、媒体类型和 SHA256，注册 append-only take。
  - 生成 QC packet；优先用确定性/人工 observation fixture，不调用云 VLM；用户可做一次人工视觉确认。
  - 用户明确 KEEP/拒绝/select；记录整个零成本证据链。
  tests:
  - strict zero-cost/loopback checks。
  - submit_count=1。
  - manju check/provider/task/QC focused tests。
  - 非 loopback sentinel transport_count=0。
  acceptance_criteria:
  - 零费用、零外部模型请求、零 API Key。
  - 中断后不重复 submit。
  - 本地媒体被 hash-bound 评审并由人选择或拒绝。
  required_evidence:
  - zero-cost policy state
  - localhost request/identity/attempt
  - submit_count
  - media SHA/ffprobe
  - QC binding
  - manual decision
  rollback:
  - 媒体 append-only；若不采用，只取消选择或保留为 rejected candidate。
  stop_conditions:
  - endpoint 不是 loopback。
  - 发现任何 provider key。
  - 脚本尝试下载模型/访问公网。
  notes:
  - 本任务不证明真实云模型质量、真实计费或真实供应商稳定性。
  - No metered API calls are allowed in this edition.
