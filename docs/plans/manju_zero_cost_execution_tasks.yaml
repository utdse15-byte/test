schema: manju.ide-execution-plan/v1
generated_on: '2026-08-11'
target:
  repository: https://github.com/utdse15-byte/test
  project_name: Manju One
  branch_hint: claude/fable-opus-task-division-wv97i6
  branch_rule: execution-time STATE.md and actual checkout are authoritative
upstreams:
- name: ViMax
  repository: https://github.com/HKUDS/ViMax
  role: clean-room methods for hierarchical directing, visual dependencies, keyframe evaluation and spatial anchors
  boundary: MIT attribution; do not use its default paid pipeline/cache as Manju runtime
- name: OpenChatCut
  repository: https://github.com/0xsline/OpenChatCut
  role: optional post-Picture-Lock finishing sidecar
  boundary: AGPL process separation; no source or Skill vendoring; neutral artifact/protocol boundary
- name: Toonflow-app
  repository: https://github.com/HBAI-Ltd/Toonflow-app
  role: clean-room UX inspiration for local workbench and three-role interaction
  boundary: supplementary license/branding terms; no copied code/assets/branding; no dynamic TS VM or SQLite truth
architecture_decision: Manju remains the sole truth, media/hash/QC/selection/Picture-Lock owner. This edition performs no
  billable inference. ViMax contributes clean-room planning methods; OpenChatCut is a localhost-only finishing sidecar without
  cloud AI; Toonflow contributes clean-room UX ideas.
non_negotiable_invariants:
- Text project files remain the sole canonical truth.
- Media remains append-only; no candidate, reference, take or finishing result is overwritten.
- Reports, graph projections, UI state, vector indexes and SQLite remain deletable and never become build/provider inputs.
- The LLM stays outside Manju; Manju code does not call an additional model API.
- Director Proposal remains the sole executable proposal store.
- Truth adoption uses the existing human-only atomic truth_patch_set.
- Strict zero-cost mode rejects every non-loopback provider transport before network I/O; there is no human override inside
  this plan.
- No cloud API key is requested, loaded, persisted or displayed.
- Reviewer observations, KEEP decisions and scores never imply selected_take or Picture Lock.
- Manju MCP is not reintroduced.
- OpenChatCut, ViMax and Toonflow remain optional; absence never blocks core workflows.
- No public-network/model-provider calls occur in tests or dogfood.
- Windows remains a hard release gate on the same commit as Ubuntu.
execution_policy:
  selection: Execute in dependency order. One task at a time; one task per commit.
  initial_task: G0-001
  commit_format: '<TASK-ID>: <imperative summary>'
  branch: Create a dedicated worktree/branch from the verified baseline. Never reset, stash or discard user changes automatically.
  owner_first: Before adding any schema/module/command, grep and test for an existing owner. Mark REUSE_ONLY or NOT_NEEDED
    when appropriate.
  zero_cost: Set and preserve strict zero-cost/offline-provider policy. Any task that would require a metered API is STOPPED
    and replaced by local fake/imported/synthetic evidence.
  context_budget: Load only the global invariants, the current task and direct dependency evidence. Use rg and focused file
    ranges; do not paste whole large files or logs into chat.
  tests: Per task run focused tests and compile/static checks only. Run affected integration suites at phase gates; run the
    full suite only at baseline and H1 release gates unless a dangerous owner change demands it.
  logs: Write verbose logs to REPORTS and report only command, exit code and concise failure summary to reduce IDE tokens.
  schema: Register every new manju.* schema literal in CONTRACTS.yaml. Prefer reuse over new contracts.
  cli: Reuse existing command groups and keep cli.py/GUI routes thin. Do not use this program for large-file refactors.
  manual_review: Stop before truth confirmation, candidate selection, OpenChatCut approval or finishing adoption.
  manual_ci: Use actual CI run IDs; never fabricate cross-platform evidence.
token_economy:
- Do not restate the plan, task card, or files already read; execute the current task directly.
- Successful commands are summarized as command, exit code, duration and pass count; never paste full logs.
- On failure include only the most relevant final 20-40 lines and the first actionable diagnosis.
- After G0-002, do not re-research upstream repositories unless the pinned source snapshot is stale for the current task.
- Do not perform opportunistic refactors, style sweeps, or unrelated test expansion.
- Complete one task per session and stop with a compact result plus the next ready task.
- Reuse same-HEAD CI evidence from STATE.md/REPORTS/LAST_GREEN.yaml at baseline; G0-001 does not rerun the full suite.
global_stop_conditions:
- Any command would call a non-loopback model, generation, OCR, ASR, search or media-provider endpoint.
- Any task asks for, discovers or tries to use a cloud API key, billing account, credit card, free-trial credit or paid subscription.
- Any task proposes a real provider submission, even if estimated cost is zero or a free tier is advertised.
- A task would create a second editable scene, shot, event, authoring-plan or timeline truth.
- A report, graph, reviewer summary, browser state, vector memory or SQLite row would become an execution input.
- A task would copy or link OpenChatCut AGPL code or Skills into Manju.
- A task would copy Toonflow code, assets, branding or dynamic TypeScript provider runtime.
- A task would execute ViMax default generation pipeline instead of Manju-native local/mock owners.
- An AI actor would confirm a truth-changing action.
- A reviewer or score would auto-select a candidate or auto-Picture-Lock.
- Existing Windows, spend, path, archive, CSRF, content-binding, locking or provider identity gates would be weakened.
- A task would automatically download large model weights or install a service with unclear resource/license requirements.
phases:
- id: G0
  name: 基线、治理与第三方边界
  goal: 冻结可复现起点，书面确定许可证、数据所有权和 clean-room 边界。
  exit_gate: 同一 HEAD 基线证据存在；三方代码未进入核心；ADR 明确采用/拒绝项。
- id: P0
  name: 零成本执行闭环与网络硬禁用
  goal: 先用 localhost 假 Provider、FFmpeg 合成媒体和已有素材验证提交恢复、下载、哈希、QC 与人工选择，同时证明任何非本地 provider transport 都被拒绝。
  exit_gate: 本地 Proof Shot 完成；模拟远程任务只 submit 一次；零外部模型请求、零 API Key、零账单；STATE 明确真实 Provider 仍未验证。
- id: D1
  name: ViMax 风格层级导演规划
  goal: 将事件链、场次、镜头和摄影机意图变成外部 IDE Agent 工作流，最终仍只采用现有 truth_patch_set。
  exit_gate: 真实故事片段可产生可审查、可过期、可原子采用的 Scene/Shot 提案，无第二真相。
- id: V1
  name: 视觉依赖图与零成本前置检查
  goal: 派生跨镜视觉依赖、当前锚点和建议波次；在 strict zero-cost mode 下所有外部 transport 一律硬阻断。
  exit_gate: 依赖可解释、可重建、可识别陈旧；本地 preflight 可演练，任何非 loopback provider transport_count=0。
- id: K1
  name: 本地关键帧 Best-of-2 与视觉评审
  goal: 复用 image takes、Preview Ladder、QC v2 和人工选择，用本地合成/已有图片验证两个关键帧候选的 lineage、评审和下游绑定。
  exit_gate: 两个零成本候选 append-only、hash-bound 评审；人工采纳的 exact hash 进入本地假视频请求身份；不宣称真实模型质量。
- id: S1
  name: 本地空间锚点与引用链
  goal: 用 FFmpeg 抽帧和已有媒体将 camera-parent/transition-anchor 思想落为 reference-only、可追溯、会过期的 refs。
  exit_gate: 父镜变化使锚点过期；子镜本地请求绑定 exact anchor hash；没有云生成或账单。
- id: F1
  name: OpenChatCut 本地精剪侧车
  goal: Picture Lock 后经中立 handoff 进入本地 OpenChatCut；仅使用非 AI、本地编辑能力，经双重人工批准返回。
  exit_gate: 导出—本地精剪—零写入分析—人工采用闭环完成；OpenChatCut 未调用外部 AI/API。
- id: W1
  name: Toonflow 风格零成本本地工作台
  goal: 在现有 localhost GUI 实现派生图视图、三角色交互与零成本 provider 状态，不引入 SQLite 真相、动态 TS Provider 或云 Key。
  exit_gate: 删除 UI 状态/reports/runtime DB 不改变 build；所有修改只生成现有 Director Proposal；外部 provider 显示为禁用。
- id: H1
  name: 零成本故障注入、跨平台与发布判定
  goal: 证明网络硬禁用、崩溃、陈旧输入、恶意包、第三方不可用和 Windows 差异下仍 fail closed。
  exit_gate: 同一 commit Ubuntu/Windows 双绿；测试证明无外部模型调用、无凭据、无隐藏真相；发布声明明确真实模型质量未验证。
