# v5.0 AV0: one owner per fact.  This is an architectural ledger, not a
# runtime input and is intentionally safe to delete from a built project.
version: 1
status: current
superseded_specs:
  - v2
  - v3
  - v4
  - v4.1
owners:
  brief_ending_script: story/*.md
  creative_charter: story/creative.yaml
  scene_dramatic_state: story/scenes/*.yaml
  shot_production_truth: shots/*.yaml
  shot_order: shots/index.yaml
  picture_spec: manju.core.spec
  expectations: manju.qc.expectations
  director_proposals: reports/proposals/*.yaml
  append_only_evidence: reports/events.jsonl
  verification_evidence: reports/verifications.jsonl
  derived_views: reports/derived/**
  media_and_takes: media/**
  provider_facts: provider manifests and accepted observed events
boundaries:
  screen_intent: "director, coverage, animatic review and control views only"
  screen_intent_excluded_from: [prompt, picture_spec, expectations]
  video_authoring_plan: >-
    derived in memory from ShotSpec, ShotContract, Bible, keyframes, dialogue
    and the existing reference resolver; never editable project truth
  video_authoring_profiles: >-
    offline prompt dialects only; never runtime Providers, routing, pricing,
    qualification, submission, polling, download, inference or Picture Lock
  external_handoff_return: >-
    full bundle verification precedes manual take registration; generator
    identity remains unverified and automatic selection remains forbidden
  legacy_projects: no_auto_migration
external_repositories:
  policy: clean_room_methods_only
  runtime_dependencies: []
  authoring_references:
    - id: minimax-h3-authoring-2026-08-08
      owner: MiniMax
      repository: MiniMax-AI/MiniMax-H3
      copied_verbatim: false
      verified_on: 2026-08-08
      upstream_commit: not_recorded_offline
      use: unofficial prompt-authoring metadata and external handoff vocabulary only
