# W1 (MANJU_WINDOWS_ONLY_LEAN_V3 §3.1): Windows is the primary platform, and
# this workflow is its HARD RELEASE gate — no continue-on-error anywhere, full
# suite, full extras, real FFmpeg. It runs everything xplat.yml deliberately
# skips (locks/process/file-semantics, board security, media, corpus, the
# whole pytest surface) on windows-latest. xplat.yml stays as the macOS
# informational watcher; ubuntu ci.yml is the dev-loop gate (it is where the
# dev loop lives).
#
# Validation model (see STATE.md): this hard gate fires on MERGE candidates
# (every pull_request) and RELEASE candidates (push to main + version tags),
# plus manual dispatch so any single commit can be proven green on Windows
# before it is merged. It deliberately does NOT run on every feature-branch
# push — that is the dev-loop gate's job (ci.yml) — which keeps the Windows
# queue clear for the commits that actually gate a merge or release. This is
# a trigger-scope change, NOT a weakening: the gate is still required and
# still full-suite for every merge and release candidate.
#
# FFmpeg pinning (§3.1 固定版本 + SHA-256): installed via a VERSION-PINNED
# Chocolatey package. Chocolatey verifies the package's embedded SHA-256
# checksums against the downloaded binaries at install time (checksum
# verification is mandatory in choco for non-local sources), so the version
# pin below + choco's checksum enforcement give a fixed, hash-verified
# toolchain. The version-assert step after install turns a silently-moved
# binary into a hard red. (A direct gyan.dev/BtbN URL + hardcoded SHA-256 in
# this file is the stricter variant; adopt it when bumping the pin — the
# authoring environment for this wave had no route to fetch the archive and
# hashing an artifact we never held would have been an invented fact.)
#
# tesseract/chi_sim and WenQuanYi are NOT installed here: the OCR/CJK-burn
# tests skip cleanly without them (the same precedent as chromium on the
# ubuntu gate, ci.yml). The FFmpeg presence assert below is the anti-rot
# guard: the suite must never go green by silently skipping the ~63
# ffmpeg-gated files.
name: Windows CI (hard release gate)

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {}

# Only the latest run for a given workflow+ref stays active; a new push to a
# PR head cancels the superseded Windows run so the queue never backs up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Python UTF-8 mode everywhere on the gate: the suite's truth files are UTF-8
# by design and gate run #3 proved the cp1252 default still bites test-side
# read_text() calls (CJK sidecars). UTF-8 mode is Python's announced future
# default; the product's own writers/readers pass encoding explicitly either way.
env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 6.1.1 = the EXACT version ubuntu-latest apt ships (gate run #1
      # proved 8.x skews ffprobe color-tag output vs the verified suite).
      - name: Install pinned FFmpeg (choco, SHA-256-verified package)
        run: choco install ffmpeg --version=6.1.1 --no-progress -y

      - name: FFmpeg present and at the pinned version (anti-silent-skip gate)
        run: |
          $ff = (Get-Command ffmpeg -ErrorAction Stop).Source
          Write-Host "ffmpeg: $ff"
          $v = (& ffmpeg -version | Select-Object -First 1)
          Write-Host $v
          # The trailing (\.|\s|$) makes this mean what the error message says.
          # A bare "6\.1" is a PREFIX match, so a 6.10 build would satisfy a
          # guard whose whole job is to reject anything that is not 6.1.x.
          if ($v -notmatch "ffmpeg version 6\.1(\.|\s|$)") { throw "ffmpeg is not the pinned 6.1.x build: $v" }
          $fp = (Get-Command ffprobe -ErrorAction Stop).Source
          Write-Host "ffprobe: $fp"

      - name: Install package with all extras
        run: pip install -c constraints.txt -e ".[dev,jianying,capcut,edgetts]"

      - name: Run the full test suite
        run: python -m pytest -q -n auto

      # The one coverage the suite lacks (mirrors ci.yml): the INSTALLED
      # console-script entry point.
      - name: Console-script entry point
        run: manju --help | Out-Null

  # W2 (§4.6): the installer contract executed on a REAL Windows host — clean
  # per-user install (no admin, no PATH edit), launcher works, uninstall
  # removes the app but NEVER a project. The static half of this contract is
  # tests/test_windows_install.py; no continue-on-error here either.
  install-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean per-user install (staging → self-test → atomic switch)
        run: .\scripts\windows\install-manju.ps1

      - name: Launcher runs without PATH edits
        run: |
          $launcher = Join-Path $env:LOCALAPPDATA "Manju\bin\manju.cmd"
          $v = & $launcher --version
          if ($LASTEXITCODE -ne 0) { throw "launcher failed" }
          if ($v -notmatch "^manju ") { throw "unexpected --version output: $v" }
          $app = Join-Path $env:LOCALAPPDATA "Manju\App"
          $current = (Get-Content (Join-Path $app "current.txt") -Raw -Encoding ASCII).Trim()
          $python = Join-Path $app "$current\venv\Scripts\python.exe"
          & $python -m manju.gui.windows_app --self-test
          if ($LASTEXITCODE -ne 0) { throw "windowless desktop self-test failed" }

      - name: Start-menu entry is branded, windowless and owned
        run: |
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Manju 工作台.lnk"
          if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) { throw "Start-menu shortcut missing" }
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($shortcut)
          if ([System.IO.Path]::GetFileName($link.TargetPath) -ne "pythonw.exe") {
            throw "shortcut is not windowless: $($link.TargetPath)"
          }
          if ($link.Arguments.Trim() -ne "-m manju.gui.windows_app") {
            throw "unexpected shortcut arguments: $($link.Arguments)"
          }
          $appRoot = [System.IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA "Manju")).TrimEnd("\") + "\"
          $target = [System.IO.Path]::GetFullPath($link.TargetPath)
          if (-not $target.StartsWith($appRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "shortcut escaped the per-user install root: $target"
          }
          $icon = ($link.IconLocation -split ",", 2)[0]
          if (-not (Test-Path -LiteralPath $icon -PathType Leaf)) { throw "shortcut icon missing: $icon" }

      - name: Uninstall refuses a live desktop session before deleting files
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Manju\App"
          $current = (Get-Content (Join-Path $app "current.txt") -Raw -Encoding ASCII).Trim()
          $python = Join-Path $app "$current\venv\Scripts\python.exe"
          $proc = Start-Process -FilePath $python -ArgumentList @("-c", '"import time; time.sleep(60)"') -WindowStyle Hidden -PassThru
          try {
            $session = @{
              format = "manju-windows-app-session.1"
              pid = $proc.Id
              url = "http://127.0.0.1:65534/"
              token = "windows-ci-running-process"
            } | ConvertTo-Json
            Set-Content -LiteralPath (Join-Path $app "workspace-session.json") -Value $session -Encoding UTF8
            $refused = $false
            try {
              .\scripts\windows\uninstall-manju.ps1
            }
            catch {
              $refused = $true
              if ($_.Exception.Message -notmatch "still running") { throw }
            }
            if (-not $refused) { throw "uninstall accepted a running installed process" }
            if (-not (Test-Path -LiteralPath (Join-Path $app "current.txt"))) {
              throw "uninstall removed application files before refusing"
            }
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $app "workspace-session.json") -Force -ErrorAction SilentlyContinue
          }

      - name: Update keeps the previous version for rollback
        run: |
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Manju 工作台.lnk"
          $shell = New-Object -ComObject WScript.Shell
          $beforeTarget = $shell.CreateShortcut($shortcut).TargetPath
          .\scripts\windows\update-manju.ps1
          $prev = Join-Path $env:LOCALAPPDATA "Manju\App\previous.txt"
          if (-not (Test-Path $prev)) { throw "previous.txt missing after update" }
          $updatedTarget = $shell.CreateShortcut($shortcut).TargetPath
          if ($updatedTarget -eq $beforeTarget) { throw "shortcut target did not follow the updated version" }
          .\scripts\windows\update-manju.ps1 -Rollback
          $launcher = Join-Path $env:LOCALAPPDATA "Manju\bin\manju.cmd"
          & $launcher --version
          if ($LASTEXITCODE -ne 0) { throw "launcher broken after rollback" }
          $rolledBackTarget = $shell.CreateShortcut($shortcut).TargetPath
          if ($rolledBackTarget -ne $beforeTarget) { throw "shortcut target did not follow rollback" }

      - name: Uninstall refuses an installed Python process without a session
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Manju\App"
          $current = (Get-Content (Join-Path $app "current.txt") -Raw -Encoding ASCII).Trim()
          $python = Join-Path $app "$current\venv\Scripts\python.exe"
          $hold = Join-Path $env:RUNNER_TEMP "hold-manju-install.py"
          Set-Content -LiteralPath $hold -Value "import time; time.sleep(30)" -Encoding ASCII
          $proc = Start-Process -FilePath $python -ArgumentList $hold -PassThru
          try {
            Start-Sleep -Milliseconds 500
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\uninstall-manju.ps1
            $uninstallExit = $LASTEXITCODE
            if ($uninstallExit -eq 0) { throw "uninstall accepted a running installed process" }
            if (-not (Test-Path -LiteralPath $app -PathType Container)) {
              throw "uninstall removed application files before refusing"
            }
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $hold -Force -ErrorAction SilentlyContinue
          }
          # The non-zero child exit is the expected proof, not this step's
          # result. GitHub's pwsh wrapper propagates LASTEXITCODE at the end.
          $global:LASTEXITCODE = 0

      - name: Uninstall never touches projects
        run: |
          $proj = Join-Path $env:USERPROFILE "作品 集\雨夜 便利店.manju"
          New-Item -ItemType Directory -Force -Path $proj | Out-Null
          Set-Content -Path (Join-Path $proj "project.yaml") -Value "name: 雨夜便利店" -Encoding UTF8
          .\scripts\windows\uninstall-manju.ps1
          if (Test-Path (Join-Path $env:LOCALAPPDATA "Manju\App")) { throw "App dir survived uninstall" }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Manju 工作台.lnk"
          if (Test-Path -LiteralPath $shortcut) { throw "owned Start-menu shortcut survived uninstall" }
          if (-not (Test-Path (Join-Path $proj "project.yaml"))) { throw "uninstall touched a project!" }
