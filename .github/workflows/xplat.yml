# macOS INFORMATIONAL watcher (never a gate).
#
# Role in the validation model (see STATE.md): "macOS / exploratory
# cross-platform checks — manual or scheduled." It surfaces macOS breakage in
# the OS-portable layers (path handling, YAML/JSON contracts, rational-time
# math, CLI surface freeze, registry consistency) WITHOUT gating merges.
# continue-on-error: a red row here is a signal to read, never a block.
#
# Scope note (cross-platform policy cleanup): Windows is NO LONGER run here.
# It has its own HARD gate (windows-ci.yml) that runs the full suite with real
# FFmpeg on every merge/release candidate, so mirroring a pure subset of it in
# this informational matrix was outdated. This watcher is macOS-only now. The
# subset still excludes everything that needs ffmpeg/tesseract/chromium or
# renders media — those stay on the real-toolchain gates (recorded in DECISIONS).
name: xplat-informational (macOS)

on:
  # Scheduled + manual only — informational, not per-commit. (Weekly, Monday
  # 06:00 UTC.) No push/PR triggers: this must never sit in the merge queue.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-suites:
    name: macos-latest (informational)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + dev extras, no media tooling)
        run: pip install -e ".[dev]"
      - name: Pure OS-portable suites
        run: >
          python -m pytest -q
          tests/test_fp_timebase.py
          tests/test_fp_contracts.py
          tests/test_fp_compat.py
          tests/test_fp_docs.py
          tests/test_fp_workflows.py
          tests/test_fp_cli_snapshot.py
          tests/test_fp_plugin_api.py
          tests/test_fp_ttml_locale.py
          tests/test_fp_bagit.py
          tests/test_fp_fcpxml_fades.py
          tests/test_fp_edl_audio.py
          tests/test_fp_edl_import.py
