name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same system deps the suite exercises locally: ffmpeg for the
      # render pipeline, tesseract (+chi_sim) for must_show OCR machine
      # checks, WenQuanYi for CJK caption burns. Chromium is NOT installed —
      # the html_render tests skip cleanly and caption cards fall back to
      # drawtext (§8.4), which is itself under test.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg tesseract-ocr tesseract-ocr-chi-sim fonts-wqy-zenhei

      - name: Install package with all extras
        run: pip install -c constraints.txt -e ".[dev,jianying,capcut,mcpvideo,edgetts]"

      - name: Run the full test suite
        run: python -m pytest -q -n auto

      # Audit TESTS F5 (DECISIONS #35): the double-build M0 smoke that used to
      # run here duplicated what tests/test_idempotency.py pins INSIDE the
      # suite (build twice → exactly one final, 24/1 fps) at ~30-60s per run.
      # The ONE coverage unique to this step is the INSTALLED console-script
      # entry point ([project.scripts] wiring) — the suite drives the app via
      # CliRunner, never the installed `manju`. Keep exactly that check.
      - name: Console-script entry point (the one coverage the suite lacks)
        run: manju --help >/dev/null
