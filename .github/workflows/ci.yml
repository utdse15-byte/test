# Ubuntu CI — the DEV-LOOP gate (REQUIRED check).
#
# Role in the validation model (see STATE.md / REPORTS/INDEX.md):
#   * Every commit + PR head: compilation + lint (static job) and the FULL
#     Ubuntu suite (test job).
# This is where the day-to-day dev loop lives. It is a REQUIRED gate, but it
# is NOT the release gate — windows-ci.yml is the HARD release gate and must
# never be weakened. macOS is informational only, on a schedule (xplat.yml).
name: CI (ubuntu — dev-loop gate)

on:
  push:
    branches: ["**"]
  pull_request:

# Only the latest run for a given workflow+ref stays active; superseded runs
# on the same branch are canceled, so pushing again never queues a second
# full suite behind the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "Every commit: compilation + linting." Cheap and fast, so a syntax error
  # or an undefined name goes red in seconds instead of minutes behind the
  # full suite. Ruff runs ONLY the obvious-error / bug-prone rule subset
  # (pyflakes F + syntax/runtime E9), NOT a repo-wide style rewrite — the repo
  # is deliberately not strict-typed or strict-styled wholesale (see task 13,
  # incremental static checking).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile every source file (compilation gate)
        run: python -m compileall -q src
      - name: Install ruff
        run: pip install "ruff>=0.6"
      # Obvious-error subset only: E9 syntax, F63 assert/comparison bugs, F7
      # misplaced statements, F82 undefined names. Style / unused-import
      # cleanup (F401, F811, isort, …) is deliberately NOT gated here — the
      # repo is migrated incrementally (task 13), not rewritten in one sweep.
      - name: Ruff — obvious errors, bug-prone patterns
        run: ruff check --select E9,F63,F7,F82 src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same system deps the suite exercises locally: ffmpeg for the
      # render pipeline, tesseract (+chi_sim) for must_show OCR machine
      # checks, WenQuanYi for CJK caption burns. Chromium is NOT installed —
      # the html_render tests skip cleanly and caption cards fall back to
      # drawtext (§8.4), which is itself under test.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg tesseract-ocr tesseract-ocr-chi-sim fonts-wqy-zenhei

      - name: Install package with all extras
        run: pip install -c constraints.txt -e ".[dev,jianying,capcut,mcpvideo,edgetts]"

      - name: Run the full test suite
        run: python -m pytest -q -n auto

      # Audit TESTS F5 (DECISIONS #35): the double-build M0 smoke that used to
      # run here duplicated what tests/test_idempotency.py pins INSIDE the
      # suite (build twice → exactly one final, 24/1 fps) at ~30-60s per run.
      # The ONE coverage unique to this step is the INSTALLED console-script
      # entry point ([project.scripts] wiring) — the suite drives the app via
      # CliRunner, never the installed `manju`. Keep exactly that check.
      - name: Console-script entry point (the one coverage the suite lacks)
        run: manju --help >/dev/null
