name: comic
title: 漫剧 / Comic drama
description: 竖屏漫剧,紧凑分格节奏、粗体字幕、人物一致性优先。
project:
  width: 1080
  height: 1920
  fps: 30
  export_profiles: [srt, jianying]
rules:
  timing:
    padding_before_ms: 120
    padding_after_ms: 180
    min_shot_ms: 900
    max_shot_ms: 6000
    default_shot_ms: 2200
  transition_default:
    type: fade
    duration_ms: 180
  music:
    gain_db: -16.0
    ducking: true
    fade_out_ms: 1200
  audio:
    voice_gain_db: 1.0
  captions:
    enabled: true
    max_chars_per_line: 14
    max_lines: 2
    style: bold
qc_focus:
  - 字幕安全区
  - 人物一致性
  - 分格节奏
  - 台词与口型对齐
scaffold:
  story/brief.md: |
    # 漫剧 · 一句话创意 / Comic drama — logline

    <!--
    一句话说清:谁、在哪、发生什么、为什么让人停下来。
    One line: who, where, what happens, and why a scroller stops.
    漫剧要点 / comic notes:
      - 快节奏分格,一个节拍≈一镜头 / fast paneling, one beat ≈ one shot
      - 人物外观必须跨镜头一致(锁定 bible/characters.yaml)
        keep character appearance consistent across shots
      - 字幕粗体、居中、底部安全区 / bold centered captions in the safe area
    -->
