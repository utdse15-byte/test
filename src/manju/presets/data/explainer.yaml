name: explainer
title: 知识口播 / Explainer
description: 竖屏知识口播,长镜头、宽字幕、音乐压低并对人声侧链闪避。
project:
  width: 1080
  height: 1920
  fps: 30
  export_profiles: [srt]
rules:
  timing:
    padding_before_ms: 150
    padding_after_ms: 250
    min_shot_ms: 1500
    max_shot_ms: 20000
    default_shot_ms: 4000
  transition_default:
    type: fade
    duration_ms: 250
  music:
    gain_db: -26.0
    ducking: true
    fade_out_ms: 1500
  audio:
    voice_gain_db: 2.0
  captions:
    enabled: true
    max_chars_per_line: 22
    max_lines: 2
    style: clean
qc_focus:
  - 字幕可读性
  - 口播清晰度
  - 音乐不盖人声
  - 信息密度与停留时长
scaffold:
  story/brief.md: |
    # 知识口播 · 一句话选题 / Explainer — topic in one line

    <!--
    一句话说清:讲什么、给谁看、看完能带走什么。
    One line: the subject, the audience, and the one takeaway.
    口播要点 / explainer notes:
      - 口播稿驱动时长,镜头可长(画面服务讲解)
        the script drives timing; shots can run long (visuals serve the talk)
      - 音乐压到 -26dB 并对人声闪避,保证口播清晰
        music sits at -26dB and ducks under voice for clarity
      - 字幕宽一些、少行数,跟随语音停顿断句
        wider captions, fewer lines, break on speech pauses
    -->
  story/script.md: |
    # 知识口播 · 讲稿 / Explainer — script

    <!--
    每段=一个要点,会成为对应镜头的 dialogue.text。
    One paragraph = one point, becomes that shot's dialogue.text.
      钩子 / hook —
      要点 1 / point 1 —
      要点 2 / point 2 —
      收束 + 行动号召 / wrap-up + call to action —
    -->
