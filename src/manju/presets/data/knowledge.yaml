name: knowledge
title: 硬核知识长条 / Deep-dive knowledge
description: 竖屏硬核知识长视频,长镜头、分章节、氛围底噪、音乐压很低;导出 srt+otio;区别于短平快的知识口播(explainer)。
project:
  width: 1080
  height: 1920
  fps: 30
  export_profiles: [srt, otio]
rules:
  timing:
    padding_before_ms: 150
    padding_after_ms: 300
    min_shot_ms: 2000
    max_shot_ms: 25000
    default_shot_ms: 8000
  transition_default:
    type: fade
    duration_ms: 300
  music:
    gain_db: -28.0
    ducking: true
    fade_out_ms: 1500
  audio:
    voice_gain_db: 2.0
    # 氛围底噪:把一段安静环境音放进 media/imports/ 再填 source,铺在长视频之下。
    # ambient bed: drop a quiet atmosphere loop into media/imports/ and set source
    # to lay a steady room-tone under a long talk (keeps it from feeling dry).
    ambient:
      source: null
      gain_db: -30.0
      ducking: false
      fade_out_ms: 1500
  captions:
    enabled: true
    max_chars_per_line: 24
    max_lines: 2
    style: clean
qc_focus:
  - 信息准确性
  - 章节卡与章节结构
  - 字幕可读性
  - 音乐不盖人声
  - 氛围音铺底(见 rules.audio.ambient)
scaffold:
  story/brief.md: |
    # 硬核知识长条 · 一句话选题 / Deep-dive — topic in one line

    <!--
    一句话说清:讲什么硬核主题、给谁看、看完能建立什么认知。
    One line: the deep topic, the audience, and the understanding they leave with.
    长条要点 / deep-dive notes:
      - 长视频靠章节撑住:先在 story/outline.md 搭好章节结构,再逐章成镜
        long form lives or dies by chapters — build story/outline.md first, then shoot chapter by chapter
      - 每章开头用章节卡标题,方便观众定位与二次检索
        open each chapter with a chapter card so viewers can locate and re-find sections
      - 信息必须准确、可溯源:关键数据/结论在讲稿里标注来源
        accuracy first — cite sources for key numbers/claims in the script
      - 建议铺一层氛围底噪(rules.audio.ambient),音乐压到 -28dB 不盖人声
        lay a quiet ambient bed (rules.audio.ambient); music at -28dB never covers the voice
      - 区别于知识口播(explainer):explainer 短平快;这里更长、成体系、分章节
        unlike explainer (short & punchy): this is longer, systematic and chaptered
    -->
  story/outline.md: |
    # 硬核知识长条 · 章节结构 / Deep-dive — chaptered outline

    <!--
    每个章节=一段完整认知;章节内每行一个节拍(一个节拍≈一镜头)。
    One chapter = one complete idea; inside it, one beat per line (one beat ≈ one shot).
      开场钩子 / cold open —
      章节 1:是什么 / chapter 1 — what it is —
      章节 2:为什么重要 / chapter 2 — why it matters —
      章节 3:如何运作/怎么做 / chapter 3 — how it works —
      章节 4:误区与边界 / chapter 4 — caveats & limits —
      收束 + 下一步 / wrap-up + next step —
    -->
