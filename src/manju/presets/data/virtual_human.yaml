name: virtual_human
title: 虚拟人出镜 / Virtual presenter
description: 竖屏虚拟人出镜,人声优先、留白紧凑;强调"复用人设"(声音/形象/语气跨视频一致),区别于一次性的虚拟人口播。
project:
  width: 1080
  height: 1920
  fps: 30
  export_profiles: [srt]
rules:
  timing:
    padding_before_ms: 100
    padding_after_ms: 150
    min_shot_ms: 1500
    max_shot_ms: 18000
    default_shot_ms: 4000
  transition_default:
    type: fade
    duration_ms: 200
  music:
    gain_db: -26.0
    ducking: true
    fade_out_ms: 1500
  audio:
    voice_gain_db: 2.0
  captions:
    enabled: true
    max_chars_per_line: 20
    max_lines: 2
    style: clean
qc_focus:
  - 人设一致性(声音/形象/语气)
  - 口型与音频对齐
  - 音乐低于人声
  - 字幕安全区
scaffold:
  story/brief.md: |
    # 虚拟人出镜 · 一句话选题 / Virtual presenter — topic in one line

    <!--
    一句话说清:这位固定虚拟人这一期要讲什么、给谁看。
    One line: what this recurring presenter covers this time, and for whom.
    出镜要点 / virtual-presenter notes:
      - 核心是"复用人设":同一个声音/形象/语气跨视频保持一致,先填 story/persona.md
        the point is a REUSED persona — same voice/look/tone across videos; fill story/persona.md first
      - 人声优先:voice +2dB,音乐压到 -26dB 并对人声闪避
        voice-forward: voice +2dB, music at -26dB ducking under the voice
      - 留白紧凑、口型对齐音频,字幕干净居中(≤20 字)
        tight paddings, lip-sync to audio, clean centered captions (≤20 chars)
      - 区别于虚拟人口播:那是单条口播;这里人设要跨期复用、稳定可认
        unlike talking_head (a one-off read): here the persona is reused and must stay recognizable
    -->
  story/persona.md: |
    # 虚拟人 · 人设卡 / Virtual presenter — persona sheet

    <!-- 把这位固定虚拟人的设定锁在这里,每期照它执行,保证跨视频一致。
         Pin this recurring presenter here and hold every episode to it. -->

    - 名称 / name:
    - 声音 / voice_id:                # TTS 音色 id 或参考音频路径 / TTS voice id or ref-audio path
    - 形象参考 / look refs:            # media/imports/ 下的定妆图 / look references under media/imports/
    - 语气与口头禅 / tone & catchphrases:
    - 受众与定位 / audience & positioning:
    - 人设红线 / never-change:         # 不能漂移的设定 / persona traits that must not drift
