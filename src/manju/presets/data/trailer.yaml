name: trailer
title: 预告片 / Trailer
description: 横屏 16:9 预告,片头片尾卡已开启(占位文案),预留转场音效槽。
project:
  width: 1920
  height: 1080
  fps: 24
  export_profiles: [srt, otio]
rules:
  timing:
    padding_before_ms: 100
    padding_after_ms: 200
    min_shot_ms: 800
    max_shot_ms: 8000
    default_shot_ms: 2000
  transition_default:
    type: fade
    duration_ms: 250
  music:
    gain_db: -12.0
    ducking: true
    fade_out_ms: 2000
  audio:
    voice_gain_db: 0.5
    # 转场音效槽:把一段 whoosh/impact 放进 media/imports/ 再填 source,
    # 每个硬切都会叠上它。transition slot: set source to a whoosh/impact clip
    # and it plays on every hard cut.
    transition_sound: null
    transition_gain_db: -8.0
  captions:
    enabled: true
    max_chars_per_line: 16
    max_lines: 2
    style: impact
packaging:
  intro:
    enabled: true
    template: chapter
    text: 片名 / TITLE
    subtext: 一句话卖点 / one-line hook
    duration_ms: 2500
  outro:
    enabled: true
    template: chapter
    text: 敬请期待 / COMING SOON
    subtext: 上线日期 / release date
    duration_ms: 2500
  cover:
    mode: frame
    frame_ms: 1000
    template: chapter
qc_focus:
  - 片头片尾卡文案
  - 转场音效槽(rules.audio.transition_sound)
  - 音乐卡点与节奏
  - 字幕安全区
scaffold:
  story/brief.md: |
    # 预告片 · 一句话卖点 / Trailer — the promise in one line

    <!--
    一句话说清:这支预告要让观众记住的一个承诺/悬念。
    One line: the single promise or mystery the trailer must leave behind.
    预告要点 / trailer notes:
      - 横屏 16:9,快节奏,音乐驱动卡点 / 16:9, punchy, music-led beats
      - 片头/片尾卡已开启,替换 packaging.yaml 里的占位文案
        intro/outro cards are on — replace the placeholder text in packaging.yaml
      - 预留了转场音效槽(rules.audio.transition_sound)
        a transition-sound slot is reserved (rules.audio.transition_sound)
    -->
